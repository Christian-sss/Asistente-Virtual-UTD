<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif">
  <!-- Plano REFERENCIAL de ejemplo. Reemplácelo por el plano oficial del campus (mismo tamaño, 1000 x 640 px)
       y ajuste las coordenadas de los puntos de atención desde el panel (Ubicaciones y canales). -->
  <rect width="1000" height="640" fill="#eef2e6"/>
  <!-- Avenidas -->
  <rect x="0" y="575" width="1000" height="65" fill="#c9ced6"/>
  <text x="500" y="615" font-size="18" fill="#4a5361" text-anchor="middle">Av. Miraflores</text>
  <rect x="0" y="0" width="60" height="575" fill="#c9ced6"/>
  <text x="34" y="290" font-size="18" fill="#4a5361" text-anchor="middle" transform="rotate(-90 34 290)">Av. Cuzco</text>
  <!-- Cerco y puerta -->
  <rect x="75" y="20" width="905" height="545" fill="none" stroke="#8a94a3" stroke-width="3" stroke-dasharray="10 6"/>
  <rect x="300" y="553" width="90" height="24" fill="#e0a526"/>
  <text x="345" y="570" font-size="13" fill="#072a4f" text-anchor="middle" font-weight="bold">Puerta principal</text>
  <!-- Caminos -->
  <path d="M345 553 L345 520 L560 520 L560 210 L880 210" fill="none" stroke="#d8d2c0" stroke-width="18" stroke-linejoin="round"/>
  <path d="M560 380 L880 380" fill="none" stroke="#d8d2c0" stroke-width="14"/>
  <!-- Edificio administrativo -->
  <rect x="230" y="320" width="250" height="185" rx="6" fill="#0b3c6f" opacity=".88"/>
  <text x="355" y="312" font-size="15" fill="#072a4f" text-anchor="middle" font-weight="bold">Edificio administrativo</text>
  <line x1="230" y1="412" x2="480" y2="412" stroke="#fff" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="470" y="400" font-size="11" fill="#fff" text-anchor="end">2.º piso</text>
  <text x="470" y="495" font-size="11" fill="#fff" text-anchor="end">1.er piso</text>
  <!-- Pabellón de facultades -->
  <rect x="610" y="185" width="190" height="105" rx="6" fill="#1c62a8" opacity=".85"/>
  <text x="705" y="178" font-size="15" fill="#072a4f" text-anchor="middle" font-weight="bold">Pabellón de la Facultad</text>
  <!-- Escuela profesional -->
  <rect x="640" y="305" width="125" height="60" rx="6" fill="#4a86c5" opacity=".85"/>
  <text x="702" y="387" font-size="13" fill="#072a4f" text-anchor="middle" font-weight="bold">Escuela Profesional</text>
  <!-- Otras zonas -->
  <rect x="110" y="60" width="380" height="200" rx="10" fill="#cfe3c0"/>
  <text x="300" y="165" font-size="15" fill="#4f7a3a" text-anchor="middle">Áreas verdes</text>
  <rect x="610" y="420" width="330" height="120" rx="10" fill="#dfe5ee"/>
  <text x="775" y="485" font-size="14" fill="#5b6675" text-anchor="middle">Aulas y laboratorios</text>
  <rect x="840" y="60" width="110" height="110" rx="6" fill="#dfe5ee"/>
  <text x="895" y="120" font-size="13" fill="#5b6675" text-anchor="middle">Biblioteca</text>
  <!-- Leyenda -->
  <rect x="85" y="28" width="420" height="24" rx="4" fill="#fff" opacity=".85"/>
  <text x="95" y="45" font-size="12" fill="#a14b00">Plano referencial: reemplazar por el plano oficial de la UNJBG</text>
  <!-- Norte -->
  <g transform="translate(940 515)"><polygon points="0,-22 8,6 0,0 -8,6" fill="#072a4f"/><text x="0" y="22" font-size="13" text-anchor="middle" fill="#072a4f">N</text></g>
</svg>
